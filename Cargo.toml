[package]
name = "vxapo-cli"
version = "0.3.0"
edition = "2021"
description = "VxAPO command-line tool for device management and diagnostics"
license = "GPL-3.0-or-later"

[workspace]
members = ["protocol"]

# CLI 被 App 周期性 spawn（list --json 每 5s 两次），进程冷启动开销是主要成本：
# 全量优化收紧二进制（LTO + 单 codegen unit + 剥符号），缩短 spawn 到退出全程。
# panic 保持默认 unwind：CLI 依赖栈回退跑 Drop（事务/句柄清理），不用 abort。
[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
winreg = "0.52"
vxapo-driver = { path = "../vxapo-driver" }
vxapo-protocol = { path = "protocol" }
serde = "1"
serde_json = "1"
windows = { version = "0.62.2", features = [
  "Win32_System_Registry",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }
